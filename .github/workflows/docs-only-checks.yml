name: Events docs-only checks

# Owner-requested (17 Nov 2026). The "test" status check is required on main,
# but checks.yml only runs when site, worker, test or config paths change.
# Without this companion, a docs-only PR could never satisfy the required
# check. This runs only when none of those paths changed (GitHub's documented
# pattern for path-filtered required checks). A PR that also touches code
# runs the real "test" job in checks.yml, and a failure there still blocks.

on:
  pull_request:
    paths-ignore:
      - ".github/workflows/checks.yml"
      - "dist/**"
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.json"
      - "wrangler.production.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "No site, worker, test or config files changed; full checks are not needed."
