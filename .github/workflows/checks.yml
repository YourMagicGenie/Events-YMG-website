name: Events checks

on:
  pull_request:
    paths:
      - ".github/workflows/checks.yml"
      - "dist/**"
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.json"
      - "wrangler.production.json"
  workflow_dispatch:
    inputs:
      visual_matrix:
        description: "Browser viewport coverage (choose full before a production release)"
        type: choice
        options: [quick, full]
        default: quick

permissions:
  contents: read

concurrency:
  group: events-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run unit and site smoke tests
        run: npm ci && npm test
      - name: Select the responsive browser matrix
        id: browser-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MANUAL_MATRIX: ${{ github.event.inputs.visual_matrix }}
        run: |
          mode=quick
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_MATRIX" == "full" ]]; then
            mode=full
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            while IFS= read -r path; do
              case "$path" in
                dist/*|src/worker.js|src/security-headers.js|test/browser-smoke.mjs)
                  mode=full
                  break
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" HEAD)
          fi
          echo "Selected browser matrix: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run responsive browser checks
        env:
          MATRIX_MODE: ${{ steps.browser-matrix.outputs.mode }}
        run: |
          if [[ "$MATRIX_MODE" == "full" ]]; then
            npm run test:e2e:full
          else
            npm run test:e2e
          fi
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-responsive-screenshots-${{ github.sha }}
          path: test-results/responsive/
          if-no-files-found: ignore
          retention-days: 3

  performance:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/issue-25-performance')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Compare base and candidate performance
        env:
          PERFORMANCE_BASE_DIR: ${{ github.workspace }}/baseline
          PERFORMANCE_LIVE_ORIGIN: https://events.ymgconsultingservices.com
        run: npm run audit:performance
      - name: Audit live security and privacy behavior
        run: node test/live-browser-audit.mjs
      - name: Upload Lighthouse comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-performance-${{ github.sha }}
          path: test-results/performance/
          if-no-files-found: ignore
          retention-days: 3
